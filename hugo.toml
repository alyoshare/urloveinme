baseURL = "http://urloveinme.com"
defaultContentLanguage = "zh"
languageCode = "zh"
title = "回首加里肋亚"
theme = "pehtheme-hugo"

# Syntax highlighting
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

summaryLength = 20 # <- 20 words are approximately 160 characters

[params]
  # Meta description, not exceeding 160 characters
  description = "回首加里肋亚 - 一个为所有孩子的中文信仰频道"
  # Main section used by the theme's pagination on the homepage
  mainSections = "posts"
  # Category featured on the homepage ("分类" block). The theme
  # hardcodes "astronomy", but it falls back to this param via
  # the layouts/_default/home.html override.
  featuredCategory = "主日学"

[author]
  name = "Ida Gao"
  bio = "一个为所有孩子的中文信仰频道"
  avatar = "https://static.wixstatic.com/media/55472c_2143a555b3bc420d9f02c2165fda8a5c~mv2.png/v1/fill/w_78,h_60,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/%E6%88%AA%E5%B1%8F2021-10-27%20%E4%B8%8B%E5%8D%881_33_44.png"
  twitter = ""

[pagination]
  pagerSize = 9 # <- Posts per page on the homepage

[[menus.main]]
  name = "首页"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "文章"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "分类"
  pageRef = "/categories"
  weight = 30

[[menus.main]]
  name = "关于我"
  pageRef = "/about"
  weight = 40

[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"
