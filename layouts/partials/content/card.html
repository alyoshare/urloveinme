<article class="relative group bg-zinc-100 hover:bg-blue-100 rounded-3xl">

	<a class="insert-link" href="{{ .RelPermalink }}"></a>

	<figure class="w-full aspect-video overflow-hidden rounded-3xl">

		{{- $page := . }}

	{{- with $src := partial "cover.html" . }}

		<img class="object-cover group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $src }}" alt="{{ $page.Title }}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;">

		{{- end }}

	</figure>

	<div class="p-6">

		<time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" | safeHTML }}">{{ .Date.Format "2006-01-02" }}</time>

		<h3 class="my-4 text-2xl font-bold">{{ .LinkTitle }}</h3>

		<p class="text-normal leading-normal text-zinc-500 line-clamp-2">{{ .Params.description | default (strings.TrimSpace (.Summary | plainify)) | truncate 100 }}</p>

	</div>
</article>
